<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1b3e">
<meta name="description" content="The Olive Hotel by Bhardwaj Group — Karnal. Menu, WiFi, nearby places, and contact info.">
<title>The Olive Hotel — Welcome</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" href="logo.png.jpeg">
<style>
  :root{
    --navy:#0d1b3e;
    --navy-deep:#081229;
    --navy-mid:#0f2049;
    --navy-light:#152758;
    --gold:#d4b46a;
    --gold-bright:#e5c67f;
    --gold-soft:#b8944d;
    --cream:#f5efe2;
    --text:#f5efe2;
    --text-dim:#a89f8a;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }

  html{
    background:var(--navy-deep);
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
  }

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(ellipse at top, #152758 0%, #0d1b3e 45%, #081229 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:36px 22px;
    position:relative;
    font-weight:400;
    letter-spacing:0.1px;
    font-feature-settings:"kern" 1, "liga" 1;
  }

  /* ============ 3D BACKGROUND CANVAS ============ */
  #bg3d{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:0.65;
  }

  /* ============ FLOATING PARTICLES ============ */
  .particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }

  .particle{
    position:absolute;
    width:3px;
    height:3px;
    background:var(--gold);
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 6px rgba(212,180,106,0.8);
    animation:floatUp linear infinite;
  }

  .particle:nth-child(1){left:8%;  animation-duration:16s; animation-delay:0s}
  .particle:nth-child(2){left:18%; animation-duration:20s; animation-delay:2s}
  .particle:nth-child(3){left:28%; animation-duration:18s; animation-delay:4s}
  .particle:nth-child(4){left:38%; animation-duration:22s; animation-delay:1s}
  .particle:nth-child(5){left:48%; animation-duration:17s; animation-delay:5s}
  .particle:nth-child(6){left:58%; animation-duration:19s; animation-delay:3s}
  .particle:nth-child(7){left:68%; animation-duration:21s; animation-delay:6s}
  .particle:nth-child(8){left:78%; animation-duration:18s; animation-delay:2.5s}
  .particle:nth-child(9){left:88%; animation-duration:20s; animation-delay:4.5s}
  .particle:nth-child(10){left:14%; animation-duration:24s; animation-delay:7s}
  .particle:nth-child(11){left:44%; animation-duration:23s; animation-delay:8s}
  .particle:nth-child(12){left:74%; animation-duration:22s; animation-delay:9s}

  @keyframes floatUp{
    0%{
      transform:translateY(100vh) scale(0.6);
      opacity:0;
    }
    10%{opacity:0.55}
    90%{opacity:0.55}
    100%{
      transform:translateY(-10vh) scale(1);
      opacity:0;
    }
  }

  /* Ambient gold glow behind content */
  body::before{
    content:'';
    position:fixed;
    top:-30%;
    left:50%;
    transform:translateX(-50%);
    width:520px;
    height:520px;
    background:radial-gradient(circle, rgba(212,180,106,0.10) 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
    filter:blur(20px);
    animation:pulseGlow 6s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{opacity:0.6; transform:translateX(-50%) scale(1)}
    50%{opacity:1; transform:translateX(-50%) scale(1.08)}
  }

  /* ============ LOGO ============ */
  .logo-wrap{
    position:relative;
    z-index:2;
    width:220px;
    max-width:60vw;
    margin-bottom:28px;
    animation:fadeInDown 1s ease .1s both;
    overflow:hidden;
    border-radius:8px;
    padding:4px;
  }

  .logo-wrap::after{
    content:'';
    position:absolute;
    top:0;
    left:-150%;
    width:80%;
    height:100%;
    background:linear-gradient(
      100deg,
      transparent 0%,
      transparent 30%,
      rgba(229,198,127,0.35) 50%,
      transparent 70%,
      transparent 100%
    );
    pointer-events:none;
    animation:logoShimmer 6s ease-in-out infinite;
    animation-delay:2s;
  }

  @keyframes logoShimmer{
    0%{left:-150%}
    30%{left:-150%}
    55%{left:150%}
    100%{left:150%}
  }

  .logo-wrap img{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 6px 24px rgba(212,180,106,0.25));
    animation:logoFloat 6s ease-in-out infinite;
  }

  @keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-6px)}
  }

  /* ============ WELCOME TEXT ============ */
  .welcome-line{
    position:relative;
    z-index:2;
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    font-weight:500;
    color:var(--gold-bright);
    letter-spacing:0.8px;
    text-align:center;
    margin-bottom:8px;
    animation:fadeInUp 1s ease .35s both;
    line-height:1.2;
  }

  .welcome-line .accent{
    font-style:italic;
    color:var(--gold);
    font-weight:600;
  }

  /* ============ HIGHLIGHT LINE ============ */
  .highlight-line{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:12px auto 10px;
    animation:fadeIn 1s ease .55s both;
    max-width:320px;
  }

  .highlight-line .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  }

  .highlight-line .dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 10px rgba(212,180,106,0.6);
    animation:dotPulse 2.5s ease-in-out infinite;
  }

  @keyframes dotPulse{
    0%,100%{transform:scale(1); opacity:0.8;}
    50%{transform:scale(1.5); opacity:1;}
  }

  .sub-line{
    position:relative;
    z-index:2;
    font-size:11px;
    letter-spacing:3.5px;
    color:var(--gold-soft);
    text-transform:uppercase;
    text-align:center;
    margin-bottom:44px;
    font-weight:500;
    animation:fadeInUp 1s ease .5s both;
  }

  /* ============ CHOICE CARDS ============ */
  .choices{
    position:relative;
    z-index:2;
    width:100%;
    max-width:430px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .choice-card{
    display:block;
    text-decoration:none;
    background:linear-gradient(155deg, rgba(212,180,106,0.10) 0%, rgba(212,180,106,0.02) 100%);
    border:1px solid rgba(212,180,106,0.28);
    border-radius:18px;
    padding:24px 26px;
    position:relative;
    overflow:hidden;
    transition:all .4s cubic-bezier(.2,.8,.3,1);
    animation:fadeInUp 1s ease backwards;
    cursor:pointer;
  }

  .choice-card:nth-child(1){animation-delay:.7s}
  .choice-card:nth-child(2){animation-delay:.85s}

  .choice-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(229,198,127,0.18) 50%, transparent 70%);
    transform:translateX(-100%);
    transition:transform .9s ease;
    pointer-events:none;
  }

  .choice-card:hover::before{
    transform:translateX(100%);
  }

  .choice-card:hover{
    border-color:var(--gold);
    transform:translateY(-3px);
    box-shadow:0 14px 40px rgba(212,180,106,0.15);
  }

  .choice-card:active{
    transform:scale(0.98);
    border-color:var(--gold);
  }

  .choice-inner{
    display:flex;
    align-items:center;
    gap:20px;
    position:relative;
    z-index:1;
  }

  .choice-icon{
    flex-shrink:0;
    width:56px;
    height:56px;
    border-radius:16px;
    background:rgba(212,180,106,0.14);
    border:1px solid rgba(212,180,106,0.24);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-bright);
    transition:all .4s ease;
  }

  .choice-card:hover .choice-icon{
    background:rgba(212,180,106,0.24);
    box-shadow:0 0 28px rgba(212,180,106,0.3);
    transform:rotate(-6deg) scale(1.06);
  }

  .choice-icon svg{
    width:28px;
    height:28px;
    stroke-width:1.6;
  }

  .choice-text{
    flex:1;
    min-width:0;
  }

  .choice-title{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    font-weight:600;
    color:var(--gold-bright);
    letter-spacing:1px;
    line-height:1.1;
    margin-bottom:5px;
  }

  .choice-desc{
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.3px;
    line-height:1.5;
  }

  .choice-arrow{
    flex-shrink:0;
    color:var(--gold-soft);
    font-size:22px;
    opacity:.55;
    transition:all .35s ease;
    font-family:'Cormorant Garamond',serif;
  }

  .choice-card:hover .choice-arrow{
    opacity:1;
    transform:translateX(5px);
    color:var(--gold-bright);
  }

  /* ============ FOOTER ============ */
  .footer{
    position:relative;
    z-index:2;
    margin-top:46px;
    text-align:center;
    animation:fadeIn 1s ease 1s both;
  }

  .footer-location{
    font-size:10px;
    letter-spacing:2.6px;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:5px;
    font-weight:500;
  }

  .footer-address{
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.4px;
    opacity:.7;
    max-width:320px;
    margin:0 auto;
    line-height:1.6;
  }

  .footer-vaan{
    display:inline-block;
    margin-top:22px;
    font-size:9px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold-soft);
    text-decoration:none;
    opacity:0.55;
    transition:opacity .3s ease;
    font-weight:500;
  }

  .footer-vaan span{
    font-family:'Cormorant Garamond',serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    color:var(--gold-bright);
    font-style:italic;
  }

  .footer-vaan:active,
  .footer-vaan:hover{
    opacity:1;
  }

  /* ============ ANIMATIONS ============ */
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
  }

  @keyframes fadeInDown{
    from{opacity:0; transform:translateY(-24px)}
    to{opacity:1; transform:translateY(0)}
  }

  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  /* ============ RESPONSIVE ============ */
  @media(max-width:380px){
    .welcome-line{font-size:22px}
    .choice-title{font-size:22px}
    .choice-icon{width:48px; height:48px}
    .choice-icon svg{width:24px; height:24px}
    .logo-wrap{width:180px}
    .sub-line{letter-spacing:2.5px}
  }

  @media(min-width:640px){
    body{padding:48px 28px}
    .logo-wrap{width:250px}
    .welcome-line{font-size:30px}
    .choice-card{padding:28px 30px}
    .choice-title{font-size:28px}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
    .particle, #bg3d{display:none}
  }
</style>
</head>
<body>

  <!-- ============ 3D BACKGROUND ============ -->
  <canvas id="bg3d" aria-hidden="true"></canvas>

  <!-- ============ FLOATING PARTICLES ============ -->
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <!-- ============ LOGO ============ -->
    <div class="logo-wrap">
    <img src="logo.png.jpeg" alt="The Olive Hotel by Bhardwaj Group">
  </div>
  <!-- ============ WELCOME ============ -->
  <h1 class="welcome-line">
    Welcome to <span class="accent">The Olive Hotel</span>
  </h1>

  <div class="highlight-line">
    <span class="line"></span>
    <span class="dot"></span>
    <span class="line"></span>
  </div>

  <div class="sub-line">Bhardwaj Group · Karnal</div>

  <!-- ============ CHOICE CARDS ============ -->
  <div class="choices">

    <a href="menu.html" class="choice-card">
      <div class="choice-inner">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 3v7a4 4 0 0 0 4 4v7"/>
            <path d="M8 3v11"/>
            <path d="M12 3v18"/>
            <path d="M18 3c-1.5 0-3 2-3 4.5S16.5 12 18 12v9"/>
          </svg>
        </div>
        <div class="choice-text">
          <div class="choice-title">Menu</div>
          <div class="choice-desc">View our full restaurant menu &amp; order on WhatsApp</div>
        </div>
        <div class="choice-arrow">→</div>
      </div>
    </a>

    <a href="info.html" class="choice-card">
      <div class="choice-inner">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V7l8-4v18"/>
            <path d="M19 21V11l-6-4"/>
            <path d="M9 9v.01"/>
            <path d="M9 12v.01"/>
            <path d="M9 15v.01"/>
            <path d="M9 18v.01"/>
          </svg>
        </div>
        <div class="choice-text">
          <div class="choice-title">Hotel Info</div>
          <div class="choice-desc">WiFi, timings, nearby places, contact &amp; reviews</div>
        </div>
        <div class="choice-arrow">→</div>
      </div>
    </a>

  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="footer-location">Karnal · Haryana</div>
    <div class="footer-address">
      Ground Floor, Infront Of Railway Station,<br>
      Railway Road, Karnal, 132001
    </div>
    <a href="https://vaan-consultancy.pages.dev" target="_blank" rel="noopener" class="footer-vaan">
      Powered by <span>VAAN</span>
    </a>
  </footer>

  <!-- ============ THREE.JS ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ============ 3D BACKGROUND ============
    (function init3D(){
      const canvas = document.getElementById('bg3d');
      if (!canvas || typeof THREE === 'undefined') return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 24;

      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: window.devicePixelRatio < 2
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const gold = 0xd4b46a;
      const goldBright = 0xe5c67f;

      // Slow rotating wireframe icosahedron
      const icoGeo = new THREE.IcosahedronGeometry(8, 1);
      const icoMat = new THREE.MeshBasicMaterial({
        color: gold,
        wireframe: true,
        transparent: true,
        opacity: 0.08
      });
      const ico = new THREE.Mesh(icoGeo, icoMat);
      ico.position.set(0, 0, -10);
      scene.add(ico);

      // Two floating torus knots
      const torus1 = new THREE.Mesh(
        new THREE.TorusKnotGeometry(2.8, 0.06, 100, 12),
        new THREE.MeshBasicMaterial({ color: goldBright, wireframe: true, transparent: true, opacity: 0.13 })
      );
      torus1.position.set(-13, 8, -8);
      scene.add(torus1);

      const torus2 = new THREE.Mesh(
        new THREE.TorusKnotGeometry(2.2, 0.05, 80, 10),
        new THREE.MeshBasicMaterial({ color: gold, wireframe: true, transparent: true, opacity: 0.11 })
      );
      torus2.position.set(14, -10, -12);
      scene.add(torus2);

      // Faint big ring
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(18, 18.3, 80),
        new THREE.MeshBasicMaterial({ color: gold, transparent: true, opacity: 0.06, side: THREE.DoubleSide })
      );
      ring.position.set(0, 0, -18);
      scene.add(ring);

      // Mouse parallax
      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      }, { passive: true });

      const clock = new THREE.Clock();
      let animationId = null;

      function animate(){
        const t = clock.getElapsedTime();

        ico.rotation.x = t * 0.08;
        ico.rotation.y = t * 0.12;

        torus1.rotation.x = t * 0.15;
        torus1.rotation.y = t * 0.10;
        torus2.rotation.x = -t * 0.12;
        torus2.rotation.y = t * 0.14;

        camera.position.x += (mouseX * 2 - camera.position.x) * 0.03;
        camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.03;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
        animationId = requestAnimationFrame(animate);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden){
          if (animationId) cancelAnimationFrame(animationId);
          animationId = null;
        } else if (!animationId){
          animate();
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }, 200);
      });

      animate();
    })();
  </script>

</body>
</html>
